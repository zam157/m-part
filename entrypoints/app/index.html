<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="msapplication-TileColor" content="#00aba9" />
    <title>m-part</title>
    <!-- 首屏绘制前同步设置主题，避免闪烁。
         放在 public/ 下外链引用：MV3 扩展页面的 CSP（script-src 'self'）
         会拒绝内联脚本，而 module 脚本是延迟执行的、来不及 -->
    <script src="/scripts/color-mode-bootstrap.js"></script>
  </head>
  <body class="font-sans">
    <div id="app"></div>
    <!-- 入口脚本必须写成**相对路径**：WXT 的 dev 预渲染插件用
         `resolve(dirname(html), src)` 解析 src，以 `/` 开头会被 path.resolve 当作
         绝对路径（Windows 上解析成 D:\client\main.tsx），dev 模式下指向不存在的
         `@fs/D:/client/main.tsx`。相对路径则会被正确改写成 dev server 的 URL。
         这个模块与根目录 index.html（web/Nitro 形态）共用，改一处即可。 -->
    <script type="module" src="../../client/main.tsx"></script>
    <noscript> This website requires JavaScript to function properly. Please enable JavaScript to continue. </noscript>
  </body>
</html>
