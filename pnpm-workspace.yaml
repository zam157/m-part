allowBuilds:
  esbuild: true
  simple-git-hooks: true
catalogMode: strict
cleanupUnusedCatalogs: true
minimumReleaseAge: 0 # 1440
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - rollup@2.80.0
  - '@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1'
catalogs:
  backend:
    nitro: latest
  build:
    '@iconify-json/lucide': ^1.2.128
    '@iconify-json/material-symbols': ^1.2.90
    '@iconify-json/solar': ^1.2.10
    '@solidjs/vite-plugin': 3.0.0-next.43
    '@unocss/eslint-config': ^66.9.1
    '@unocss/preset-web-fonts': ^66.9.1
    filesystem-routing: 0.3.1
    unocss: ~66.10.5
    unocss-preset-shadcn: ^1.0.1
    vite: ^8.2.2
    vite-plugin-pwa: ^1.3.0
  dev:
    '@antfu/eslint-config': ^9.3.0
    '@types/node': ^26.4.0
    '@vitest/browser-playwright': ^4.1.11
    eslint: ^10.9.1
    eslint-plugin-format: ^2.0.1
    eslint-plugin-solid: ^0.14.3
    jsdom: ^30.0.1
    nano-staged: ^1.0.2
    simple-git-hooks: ^2.14.0
    typescript: ^7.0.2
    vitest: ^4.1.11
  frontend:
    '@solidjs/router': 2.0.0-next.24
    '@solidjs/web': 2.0.0-rc.8
    solid-js: 2.0.0-rc.8
  shared:
    crypto-es: ^3.1.3
    valibot: ^1.4.2
