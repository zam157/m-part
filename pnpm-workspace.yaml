packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  simple-git-hooks: true
catalogMode: strict
cleanupUnusedCatalogs: true
minimumReleaseAge: 0 # 1440
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - rollup@2.80.0
  - '@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1'
catalogs:
  backend:
    nitro: latest
  build:
    '@iconify-json/lucide': ^1.2.147
    '@iconify-json/material-symbols': ^1.2.95
    '@iconify-json/solar': ^1.2.13
    '@solidjs/vite-plugin': 3.0.0-next.51
    '@unocss/eslint-config': ^66.11.0
    '@unocss/preset-web-fonts': ^66.11.0
    filesystem-routing: 0.4.0
    unocss: ~66.11.0
    vite: ^8.3.5
    wxt: ^0.21.4
  dev:
    '@antfu/eslint-config': ^9.5.1
    '@types/chrome': ^0.3.6
    '@types/node': ^26.6.5
    eslint: ^10.13.0
    eslint-plugin-format: ^2.0.1
    eslint-plugin-solid: ^0.18.1
    jsdom: ^30.1.3
    nano-staged: ^1.0.2
    simple-git-hooks: ^2.14.0
    typescript: ^7.0.2
    vitest: ^5.0.5
  frontend:
    '@solidjs/router': 2.0.0-next.41
    '@solidjs/web': 2.0.0-rc.16
    cn: ^0.5.0
    solid-js: 2.0.0-rc.16
  shared:
    crypto-es: ^3.1.3
    valibot: ^1.5.0
